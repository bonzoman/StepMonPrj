server: # webserver port(default : 8080, 0으로 하면 random port)
  port: 5555

spring:
  # 데이터베이스 연결 정보
  datasource:
    # mysql
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/g2mDB?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: g2m
    password: g2m1!g2m2@
    # 커넥션 풀 (HikariCP) 설정 (선택)
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

springdoc:
  swagger-ui:
    csrf:
      enabled: true

mybatis:
  mapper-locations: file:src/main/java/com/bnz/stepmon/**/*Query.xml # xml파일을 src/main/java 하위에 두고 싶을때...(비추천)
#  mapper-locations: classpath:mapper/*Query.xml # src/main/resources 하위에 놓는경우(default)
  configuration:
    map-underscore-to-camel-case: true #카멜 케이스 자동 변환 (db_column -> dbColumn)
    call-setters-on-nulls: true #쿼리 결과가 null일 때 setter 호출 여부
    jdbc-type-for-null: NULL

