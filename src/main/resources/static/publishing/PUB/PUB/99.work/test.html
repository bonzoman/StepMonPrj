	<div>
		<div class="time">
			48:57
		</div>
		<button class="play" onclick="TimerStart()">play</button>
		<button class="pause" onclick="TimerPause()">pause</button>
		<button class="data" onclick="data()">시간확인</button>
		<input type="text" disabled>
	</div>
	<script>
		var setTime = $(".time").text();
		var setTime = setTime.split(":");
		var thisTime = (Number(setTime[0])*60)+Number(setTime[1]);
		function TimerStart(){
			isPause = false;
			TimerFunction = setInterval(function(){
				var min = 0;
				var sec = 0;
				thisTime++;
				min = Math.floor(thisTime/60);
				sec = thisTime%60;
				var thisMM = min;
				var thisSS = sec;
				if(thisMM < 10){
					thisMM = "0" + min;
				}
				if(thisSS < 10){
					thisSS = "0" + sec;
				}
				$(".time").text(thisMM+":"+thisSS).css({color:""})
				if(thisMM >= 49){
					$(".time").css({color:"#f0f"})
				}
				if(thisMM >= 50){
					TimerPause()
					$(".play").attr("disabled","")
				}
			}, 1000)
		}
		function TimerPause(){
			isPause = true;
			clearInterval(TimerFunction)
			$(".time").css({color:"#f00"})
		}
		TimerStart()
