<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>StepMon Admin - Device Search</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        [x-cloak] {
            display: none !important;
        }

        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .htmx-indicator {
            display: none !important;
        }

        .htmx-request.htmx-indicator,
        .htmx-request .htmx-indicator {
            display: flex !important;
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen font-sans text-slate-900">

    <nav class="sticky top-0 z-50 glass border-b border-slate-200 px-6 py-4 mb-8">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-emerald-500 to-blue-600 bg-clip-text text-transparent">
                StepMon Admin
            </h1>
            <div class="flex items-center space-x-4">
                <select id="global-timezone"
                    class="text-xs font-bold bg-white/50 border border-slate-200 rounded-lg px-2 py-1 outline-none focus:border-emerald-500 transition-all text-slate-600">
                    <option value="UTC">UTC (Standard)</option>
                    <option value="Asia/Seoul" selected>Asia/Seoul (KST)</option>
                    <option value="America/New_York">America/New_York (EST/EDT)</option>
                    <option value="Europe/London">Europe/London (GMT/BST)</option>
                    <option value="Asia/Tokyo">Asia/Tokyo (JST)</option>
                </select>
                <div
                    class="h-8 w-8 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-700 font-bold">
                    A</div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 pb-12">

        <!-- Search Header -->
        <div class="mb-81">
            <h2 class="text-3xl font-black text-slate-800 mb-2">디바이스 검색</h2>
            <p class="text-slate-500">등록된 디바이스 상태를 실시간으로 조회하고 관리합니다.</p>
        </div>

        <!-- Search Form Card -->
        <div
            class="bg-white rounded-3xl shadow-xl shadow-slate-200/50 p-6 mb-6 border border-slate-100 transition-all hover:shadow-2xl hover:shadow-slate-200/60">
            <form class="space-y-4" hx-indicator="#loading-overlay" hx-post="/admin/devices/table"
                hx-target="#device-table-container" hx-trigger="submit" id="search-form"
                th:hx-headers="${_csrf} != null ? '{&quot;X-CSRF-TOKEN&quot;: &quot;' + ${_csrf.token} + '&quot;}' : ''">

                <input id="search-page" name="page" th:value="${searchReq.pageNumber}" type="hidden">

                <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4">
                    <!-- 기본 검색 조건 -->
                    <div class="space-y-1">
                        <label class="text-xs font-bold text-slate-500 ml-1 uppercase" for="installId">Install
                            ID</label>
                        <input
                            class="w-full px-4 py-2 rounded-xl bg-slate-50 border-transparent focus:bg-white focus:border-emerald-500 transition-all outline-none text-sm text-slate-700"
                            id="installId" name="installId" placeholder="부분 검색..." th:value="${searchReq.installId}"
                            type="text">
                    </div>

                    <div class="space-y-1">
                        <label class="text-xs font-bold text-slate-500 ml-1 uppercase" for="deviceToken">Device
                            Token</label>
                        <input
                            class="w-full px-4 py-2 rounded-xl bg-slate-50 border-transparent focus:bg-white focus:border-emerald-500 transition-all outline-none text-sm text-slate-700"
                            id="deviceToken" name="deviceToken" placeholder="부분 검색..."
                            th:value="${searchReq.deviceToken}" type="text">
                    </div>

                    <div class="space-y-1">
                        <label class="text-xs font-bold text-slate-500 ml-1 uppercase" for="isNotificationEnabled">알림
                            설정</label>
                        <select
                            class="w-full px-4 py-2 rounded-xl bg-slate-50 border-transparent focus:bg-white focus:border-emerald-500 transition-all outline-none text-sm text-slate-700"
                            id="isNotificationEnabled" name="isNotificationEnabled">
                            <option value="">전체</option>
                            <option th:selected="${searchReq.isNotificationEnabled == true}" value="true">활성화</option>
                            <option th:selected="${searchReq.isNotificationEnabled == false}" value="false">비활성화
                            </option>
                        </select>
                    </div>

                    <div class="space-y-1">
                        <label class="text-xs font-bold text-slate-500 ml-1 uppercase" for="isActive">활성 상태</label>
                        <select
                            class="w-full px-4 py-2 rounded-xl bg-slate-50 border-transparent focus:bg-white focus:border-emerald-500 transition-all outline-none text-sm text-slate-700"
                            id="isActive" name="isActive">
                            <option value="">전체</option>
                            <option th:selected="${searchReq.isActive == true}" value="true">정상</option>
                            <option th:selected="${searchReq.isActive == false}" value="false">비활성</option>
                        </select>
                    </div>


                    <div class="space-y-1">
                        <label class="text-xs font-bold text-slate-500 ml-1 uppercase" for="size">표시 건수</label>
                        <div class="relative">
                            <select
                                class="w-full px-4 py-2 rounded-xl bg-slate-50 border-transparent focus:bg-white focus:border-emerald-500 transition-all outline-none text-sm text-slate-700 appearance-none"
                                id="size" name="size">
                                <option th:selected="${searchReq.pageSize == 30}" value="30">30개씩 보기</option>
                                <option th:selected="${searchReq.pageSize == 100}" value="100">100개씩 보기</option>
                                <option th:selected="${searchReq.pageSize == 1000}" value="1000">1000개씩 보기</option>
                            </select>
                            <div
                                class="absolute inset-y-0 right-3 flex items-center pointer-events-none text-slate-400">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round"
                                        stroke-width="2"></path>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-end">
                        <button
                            class="w-full bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold px-6 py-2 rounded-xl shadow-lg shadow-emerald-500/30 transition-all flex items-center justify-center space-x-2"
                            type="submit">
                            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round"
                                    stroke-linejoin="round" stroke-width="3" />
                            </svg>
                            <span class="text-sm">검색하기</span>
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Results Table Card -->
        <div
            class="bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 overflow-hidden relative">
            <!-- Loading Overlay (HTMX Indicator) -->
            <div class="absolute inset-0 bg-white/50 backdrop-blur-[2px] z-10 flex items-center justify-center htmx-indicator"
                id="loading-overlay">
                <div class="flex flex-col items-center">
                    <div
                        class="animate-spin rounded-full h-12 w-12 border-4 border-emerald-500/20 border-t-emerald-500 mb-4">
                    </div>
                    <p class="text-emerald-700 font-bold animate-pulse">데이터를 불러오는 중...</p>
                </div>
            </div>

            <!-- Table Container (HTMX Target) -->
            <div hx-post="/admin/devices/table" hx-trigger="load" id="device-table-container"
                th:hx-headers="${_csrf} != null ? '{&quot;X-CSRF-TOKEN&quot;: &quot;' + ${_csrf.token} + '&quot;}' : ''">
                <!-- 초기 로딩 시 표시될 내용 -->
                <div class="p-20 text-center text-slate-400">
                    <div class="animate-pulse flex flex-col items-center">
                        <div class="h-10 w-10 bg-slate-100 rounded-full mb-4"></div>
                        <p class="text-sm font-medium">관리 정보를 안전하게 연결 중...</p>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <footer class="mt-12 py-8 text-center text-slate-400 text-sm border-t border-slate-200">
        &copy; 2024 StepMon Project. Standardized on UTC. All rights reserved.
    </footer>

    <script>
        // UTC -> 선택된 타임존 시간 변환 함수
        function convertUtcToLocal() {
            const tz = document.getElementById('global-timezone').value;
            document.querySelectorAll('[data-utc]').forEach(el => {
                const utcStr = el.getAttribute('data-utc');
                if (!utcStr || utcStr === 'null') return;

                try {
                    const date = new Date(utcStr);
                    if (isNaN(date.getTime())) return;

                    const formatter = new Intl.DateTimeFormat('ko-KR', {
                        year: 'numeric', month: '2-digit', day: '2-digit',
                        hour: '2-digit', minute: '2-digit', second: '2-digit',
                        hour12: false,
                        timeZone: tz
                    });

                    el.innerText = formatter.format(date);
                } catch (e) {
                    console.error('Time conversion error:', e);
                }
            });
        }

        // HTMX 요청 후 시간 변환 실행
        document.body.addEventListener('htmx:afterOnLoad', function () {
            convertUtcToLocal();
        });

        // 초기 로드 시 실행
        document.addEventListener('DOMContentLoaded', function () {
            convertUtcToLocal();

            // 타임존 변경 시 즉시 변환
            document.getElementById('global-timezone').addEventListener('change', convertUtcToLocal);

            // 검색 버튼 클릭 시 0페이지로 리셋
            const searchForm = document.getElementById('search-form');
            if (searchForm) {
                // 모든 input/select 변경 시 페이지를 0으로 리셋 (단, page/timezone hidden input은 제외)
                searchForm.querySelectorAll('input:not(#search-page), select').forEach(el => {
                    el.addEventListener('change', () => {
                        document.getElementById('search-page').value = 0;
                    });
                });
            }
        });
    </script>
</body>

</html>
