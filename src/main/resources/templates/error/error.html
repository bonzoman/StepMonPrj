<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오류가 발생했습니다 - StepMon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #fff1f2, #f8fafc);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6 text-slate-800">
    <div class="max-w-md w-full text-center space-y-8">
        <!-- Visual Element -->
        <div class="relative inline-block">
            <h1 class="text-[12rem] font-black text-rose-600/10 leading-none select-none">Err</h1>
            <div class="absolute inset-0 flex items-center justify-center">
                <div class="w-32 h-32 bg-rose-500/10 rounded-full animate-pulse flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-rose-600" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                </div>
            </div>
        </div>

        <!-- Content -->
        <div class="space-y-4">
            <h2 class="text-3xl font-bold tracking-tight text-slate-900">오류가 발생했습니다</h2>
            <p class="text-slate-500 leading-relaxed">
                시스템 처리 중 예기치 않은 오류가 발생했습니다.<br>
                잠시 후 다시 시도해 주세요.
            </p>
            <div th:if="${error}" class="mt-4 p-4 bg-slate-100 rounded-xl text-left">
                <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Error Details</div>
                <p class="text-xs font-mono text-slate-600 break-all" th:text="${error}">Internal Server Error</p>
                <p th:if="${status}" class="text-xs font-mono text-slate-400 mt-1" th:text="'Status: ' + ${status}">
                    Status: 500</p>
            </div>
        </div>

        <!-- Action -->
        <div class="pt-6">
            <a href="/"
                class="inline-flex items-center px-8 py-4 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-2xl shadow-lg shadow-slate-500/25 transition-all hover:scale-105 active:scale-95 space-x-2">
                <span>홈으로 돌아가기</span>
            </a>
        </div>

        <!-- Footer -->
        <div class="text-xs text-slate-400 font-medium">
            &copy; 2026 StepMon. All rights reserved.
        </div>
    </div>
</body>

</html>
